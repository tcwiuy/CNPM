name: CI/CD Pipeline

on:
  push:
    branches: ["master"]

jobs:
  # --- PHẦN 1: KIỂM TRA CODE (CI) ---
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Liệt kê tên các thư mục chứa code Backend
        service:
          [
            api-gateway,
            eureka-service,
            user-service,
            order-service,
            restaurant-service,
            notification-service,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21" # Phải khớp với code của bạn
          distribution: "temurin"
          cache: "maven"

      # Chạy lệnh Maven để kiểm tra xem code có lỗi cú pháp không
      - name: Build with Maven
        run: |
          cd ${{ matrix.service }}
          chmod +x mvnw
          ./mvnw clean package 

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend
          npm install
          npm run build

  # --- PHẦN 2: ĐÓNG GÓI & VẬN CHUYỂN (CD) ---

  # Job riêng để pull và cache base image trước (chạy song song, không block pipeline)
  # Sử dụng GitHub Container Registry để tránh rate limit
  cache-base-image:
    runs-on: ubuntu-latest
    continue-on-error: true  # Không fail pipeline nếu job này fail
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull and push base image to our registries
        continue-on-error: true
        run: |
          echo "Attempting to pull and cache base image..."
          # Thử pull từ Docker Hub với retry
          for i in {1..3}; do
            if docker pull eclipse-temurin:21-jdk-alpine; then
              echo "Successfully pulled base image on attempt $i"
              break
            else
              echo "Attempt $i failed, waiting 10 seconds before retry..."
              sleep 10
            fi
          done
          
          # Tag và push lên cả Docker Hub và GHCR
          docker tag eclipse-temurin:21-jdk-alpine ${{ secrets.DOCKERHUB_USERNAME }}/base-image:eclipse-temurin-21-jdk-alpine || true
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/base-image:eclipse-temurin-21-jdk-alpine || true
          
          docker tag eclipse-temurin:21-jdk-alpine ghcr.io/${{ github.repository_owner }}/base-image:eclipse-temurin-21-jdk-alpine || true
          docker push ghcr.io/${{ github.repository_owner }}/base-image:eclipse-temurin-21-jdk-alpine || true
          echo "Base image cached successfully"

  docker-backend:
    needs: build-backend # Chỉ cần build-backend, cache-base-image là optional
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            api-gateway,
            eureka-service,
            user-service,
            order-service,
            restaurant-service,
            notification-service,
          ]
    steps:
      - uses: actions/checkout@v4

      # Đăng nhập vào Docker Hub TRƯỚC khi build để tăng rate limit
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Set up Docker Buildx để hỗ trợ cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cần cài lại Java để build file .jar (vì mỗi job chạy trên máy mới tinh)
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # Build ra file .jar
      - name: Build Jar
        run: |
          cd ${{ matrix.service }}
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # Login to GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Thử pull base image từ cache (GHCR hoặc Docker Hub), nếu có thì sẽ dùng cached image
      - name: Check cached base image
        id: cache-check
        run: |
          # Ưu tiên pull từ GHCR (không có rate limit)
          if docker pull ghcr.io/${{ github.repository_owner }}/base-image:eclipse-temurin-21-jdk-alpine 2>/dev/null; then
            echo "cached_image=ghcr.io/${{ github.repository_owner }}/base-image:eclipse-temurin-21-jdk-alpine" >> $GITHUB_OUTPUT
            echo "Using cached base image from GHCR"
          elif docker pull ${{ secrets.DOCKERHUB_USERNAME }}/base-image:eclipse-temurin-21-jdk-alpine 2>/dev/null; then
            echo "cached_image=${{ secrets.DOCKERHUB_USERNAME }}/base-image:eclipse-temurin-21-jdk-alpine" >> $GITHUB_OUTPUT
            echo "Using cached base image from Docker Hub"
          else
            echo "cached_image=eclipse-temurin:21-jdk-alpine" >> $GITHUB_OUTPUT
            echo "Cache not available, will use original image (may hit rate limit)"
          fi
      
      # Đóng gói và Đẩy lên với cache
      - uses: docker/build-push-action@v5
        with:
          # Chỉ cho Docker biết code nằm ở đâu (ví dụ: ./user-service)
          # Nó sẽ tự tìm file Dockerfile trong thư mục đó
          context: ./${{ matrix.service }}
          push: true
          # Đặt tên thẻ bài: ten-user/ten-service:latest
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
          # Sử dụng cache từ registry để tối ưu
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:buildcache,mode=max
          # Sử dụng cached image nếu có, nếu không sẽ dùng image gốc
          build-args: BASE_IMAGE=${{ steps.cache-check.outputs.cached_image }}

  docker-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/food-ordering-frontend:latest

  # --- PHẦN 3: TỰ ĐỘNG DEPLOY (CD) ---
  # Job mới được thêm vào
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    # Bắt buộc 2 job build image phải thành công thì mới deploy
    needs: [docker-backend, docker-frontend]

    steps:
      - name: Deploy to Server
        # Sử dụng action có sẵn để SSH
        uses: appleboy/ssh-action@master
        with:
          # Lấy thông tin từ GitHub Secrets mà bạn đã tạo
          host: ${{ secrets.AZURE_SSH_HOST }}
          username: ${{ secrets.AZURE_SSH_USER }}
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}

          # Các lệnh sẽ chạy trên VPS
          script: |
            cd ~/CNPM
            sudo docker-compose pull
            sudo docker-compose up -d
            sudo docker image prune -f
