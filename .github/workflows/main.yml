name: CI/CD Pipeline

on:
  push:
    branches: ["master"]

jobs:
  # --- PHẦN 1: KIỂM TRA CODE (CI) ---
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Liệt kê tên các thư mục chứa code Backend
        service:
          [
            api-gateway,
            eureka-service,
            user-service,
            order-service,
            restaurant-service,
            notification-service,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21" # Phải khớp với code của bạn
          distribution: "temurin"
          cache: "maven"

      # Chạy lệnh Maven để kiểm tra xem code có lỗi cú pháp không
      - name: Build with Maven
        run: |
          cd ${{ matrix.service }}
          chmod +x mvnw
          ./mvnw clean package | tee build.log        # 👈 ADDED

      # --- PARSE AND SEND MAVEN TEST SUMMARY TO LOKI ---
      - name: Send Test Summary to Loki
        run: |
          FILE="${{ matrix.service }}/build.log"
          # Extract the first summary line like: "Tests run: 3, Failures: 0, Errors: 0, Skipped: 0"
          SUMMARY_LINE=$(grep -m1 -E "^\[INFO\] Tests run:" "$FILE" | sed 's/^\[INFO\] //')
          if [ -z "$SUMMARY_LINE" ]; then
            SUMMARY_LINE="Tests run: 0, Failures: 0, Errors: 0, Skipped: 0"
          fi

          RUN=$(echo "$SUMMARY_LINE" | sed -n 's/.*Tests run: \([0-9]\+\).*$/\1/p')
          FAIL=$(echo "$SUMMARY_LINE" | sed -n 's/.*Failures: \([0-9]\+\).*$/\1/p')
          ERR=$(echo "$SUMMARY_LINE" | sed -n 's/.*Errors: \([0-9]\+\).*$/\1/p')
          SKIP=$(echo "$SUMMARY_LINE" | sed -n 's/.*Skipped: \([0-9]\+\).*$/\1/p')

          MSG="${SUMMARY_LINE}"

          echo "$MSG" \
            | jq -R -s --arg job "ci" --arg service "${{ matrix.service }}" --arg stage "tests" \
                   --arg tests_run "$RUN" --arg failures "$FAIL" --arg errors "$ERR" --arg skipped "$SKIP" \
                   --arg ts "$(date +%s%N)" '
                {streams: [{
                  stream: {job:$job, service:$service, stage:$stage, tests_run:$tests_run, failures:$failures, errors:$errors, skipped:$skipped},
                  values: [[$ts, .]]
                }]}
              ' \
            | curl -s -X POST "${{ secrets.LOKI_URL }}/loki/api/v1/push" -H "Content-Type: application/json" --data-binary @-

      # --- SEND BUILD LOGS TO LOKI CHUNKED ---
      - name: Send build logs to Loki
        run: |
          FILE="${{ matrix.service }}/build.log"
          CHUNK=5000
          TOTAL_LINES=$(wc -l < "$FILE")
          for START in $(seq 1 $CHUNK $TOTAL_LINES); do
            END=$((START + CHUNK - 1))
            sed -n "${START},${END}p" "$FILE" \
              | jq -R -s --arg job "ci" --arg service "${{ matrix.service }}" --arg stage "build" --arg test "test" --arg ts "$(date +%s%N)" '
                {streams: [{stream: {job:$job, service:$service, stage:$stage, test:$test}, values: [[$ts, .]]}]}
              ' \
              | curl -s -X POST "${{ secrets.LOKI_URL }}/loki/api/v1/push" -H "Content-Type: application/json" --data-binary @-
          done

      - name: Send build status to Loki (success)
        if: ${{ success() }}
        run: |
          echo "build finished: success" \
            | jq -R -s --arg job "ci" --arg service "${{ matrix.service }}" --arg stage "build" --arg test "test" --arg status "success" --arg ts "$(date +%s%N)" '
                {streams: [{stream: {job:$job, service:$service, stage:$stage, test:$test, status:$status}, values: [[$ts, .]]}]}
              ' \
            | curl -s -X POST "${{ secrets.LOKI_URL }}/loki/api/v1/push" -H "Content-Type: application/json" --data-binary @-

      - name: Send build status to Loki (failure)
        if: ${{ failure() }}
        run: |
          echo "build finished: failure" \
            | jq -R -s --arg job "ci" --arg service "${{ matrix.service }}" --arg stage "build" --arg test "test" --arg status "failure" --arg ts "$(date +%s%N)" '
                {streams: [{stream: {job:$job, service:$service, stage:$stage, test:$test, status:$status}, values: [[$ts, .]]}]}
              ' \
            | curl -s -X POST "${{ secrets.LOKI_URL }}/loki/api/v1/push" -H "Content-Type: application/json" --data-binary @-

  # ==========================================
  # 2. CI - BUILD FRONTEND
  # ==========================================
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend
          npm install
          npm run build | tee build.log             # 👈 ADDED

      # --- SEND FRONTEND BUILD LOGS TO LOKI CHUNKED ---
      - name: Send FE build logs to Loki
        run: |
          FILE="frontend/build.log"
          CHUNK=5000
          TOTAL_LINES=$(wc -l < "$FILE")
          for START in $(seq 1 $CHUNK $TOTAL_LINES); do
            END=$((START + CHUNK - 1))
            sed -n "${START},${END}p" "$FILE" \
              | jq -R -s --arg job "ci" --arg service "frontend" --arg stage "build" --arg test "test" --arg ts "$(date +%s%N)" '
                {streams: [{stream: {job:$job, service:$service, stage:$stage, test:$test}, values: [[$ts, .]]}]}
              ' \
              | curl -s -X POST "${{ secrets.LOKI_URL }}/loki/api/v1/push" -H "Content-Type: application/json" --data-binary @-
          done

      - name: Send build status to Loki (success)
        if: ${{ success() }}
        run: |
          echo "build finished: success" \
            | jq -R -s --arg job "ci" --arg service "frontend" --arg stage "build" --arg test "test" --arg status "success" --arg ts "$(date +%s%N)" '
                {streams: [{stream: {job:$job, service:$service, stage:$stage, test:$test, status:$status}, values: [[$ts, .]]}]}
              ' \
            | curl -s -X POST "${{ secrets.LOKI_URL }}/loki/api/v1/push" -H "Content-Type: application/json" --data-binary @-

      - name: Send build status to Loki (failure)
        if: ${{ failure() }}
        run: |
          echo "build finished: failure" \
            | jq -R -s --arg job "ci" --arg service "frontend" --arg stage "build" --arg test "test" --arg status "failure" --arg ts "$(date +%s%N)" '
                {streams: [{stream: {job:$job, service:$service, stage:$stage, test:$test, status:$status}, values: [[$ts, .]]}]}
              ' \
            | curl -s -X POST "${{ secrets.LOKI_URL }}/loki/api/v1/push" -H "Content-Type: application/json" --data-binary @-

  # --- PHẦN 3: ĐÓNG GÓI & VẬN CHUYỂN (CD) ---

  docker-backend:
    needs: build-backend # Bắt buộc phần CI phải xanh thì mới làm phần này
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            api-gateway,
            eureka-service,
            user-service,
            order-service,
            restaurant-service,
            notification-service,
          ]
    steps:
      - uses: actions/checkout@v4

      # Cần cài lại Java để build file .jar (vì mỗi job chạy trên máy mới tinh)
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # Build ra file .jar
      - name: Build Jar
        run: |
          cd ${{ matrix.service }}
          chmod +x mvnw
          ./mvnw clean package -DskipTests | tee cd.log     # 👈 ADDED

      # --- SEND CD LOGS TO LOKI CHUNKED ---
      - name: Send CD build logs to Loki
        run: |
          FILE="${{ matrix.service }}/cd.log"
          CHUNK=5000
          TOTAL_LINES=$(wc -l < "$FILE")
          for START in $(seq 1 $CHUNK $TOTAL_LINES); do
            END=$((START + CHUNK - 1))
            sed -n "${START},${END}p" "$FILE" \
              | jq -R -s --arg job "cd" --arg service "${{ matrix.service }}" --arg stage "docker-build" --arg test "test" --arg ts "$(date +%s%N)" '
                {streams: [{stream: {job:$job, service:$service, stage:$stage, test:$test}, values: [[$ts, .]]}]}
              ' \
              | curl -s -X POST "${{ secrets.LOKI_URL }}/loki/api/v1/push" -H "Content-Type: application/json" --data-binary @-
          done

      - name: Send CD status to Loki (success)
        if: ${{ success() }}
        run: |
          echo "cd finished: success" \
            | jq -R -s --arg job "cd" --arg service "${{ matrix.service }}" --arg stage "docker-build" --arg test "test" --arg status "success" --arg ts "$(date +%s%N)" '
                {streams: [{stream: {job:$job, service:$service, stage:$stage, test:$test, status:$status}, values: [[$ts, .]]}]}
              ' \
            | curl -s -X POST "${{ secrets.LOKI_URL }}/loki/api/v1/push" -H "Content-Type: application/json" --data-binary @-

      - name: Send CD status to Loki (failure)
        if: ${{ failure() }}
        run: |
          echo "cd finished: failure" \
            | jq -R -s --arg job "cd" --arg service "${{ matrix.service }}" --arg stage "docker-build" --arg test "test" --arg status "failure" --arg ts "$(date +%s%N)" '
                {streams: [{stream: {job:$job, service:$service, stage:$stage, test:$test, status:$status}, values: [[$ts, .]]}]}
              ' \
            | curl -s -X POST "${{ secrets.LOKI_URL }}/loki/api/v1/push" -H "Content-Type: application/json" --data-binary @-

      # Đăng nhập vào Docker Hub bằng chìa khóa bạn đã cất
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Đóng gói và Đẩy lên
      - uses: docker/build-push-action@v5
        with:
          # Chỉ cho Docker biết code nằm ở đâu (ví dụ: ./user-service)
          # Nó sẽ tự tìm file Dockerfile trong thư mục đó
          context: ./${{ matrix.service }}
          push: true
          # Đặt tên thẻ bài: ten-user/ten-service:latest
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

  # ==========================================
  # 4. CD - DOCKER FRONTEND
  # ==========================================
  docker-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/food-ordering-frontend:latest

  # --- PHẦN 3: TỰ ĐỘNG DEPLOY (CD) ---
  # Job mới được thêm vào
  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    # Bắt buộc 2 job build image phải thành công thì mới deploy
    needs: [docker-backend, docker-frontend]

    steps:
      - name: Deploy to Server
        # Sử dụng action có sẵn để SSH
        uses: appleboy/ssh-action@master
        with:
          # Lấy thông tin từ GitHub Secrets mà bạn đã tạo
          host: ${{ secrets.AZURE_SSH_HOST }}
          username: ${{ secrets.AZURE_SSH_USER }}
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}

          # Các lệnh sẽ chạy trên VPS
          script: |
            cd ~/CNPM
            sudo docker-compose pull
            sudo docker-compose up -d
            sudo docker image prune -f

      # --- SEND DEPLOY LOGS TO LOKI CHUNKED ---
      - name: Send Deploy Logs to Loki
        run: |
          FILE="deploy.log"
          # If the deploy log doesn't exist or is empty, skip upload to avoid failing the job
          if [ ! -f "$FILE" ] || [ ! -s "$FILE" ]; then
            echo "File $FILE not found or empty, skipping Loki upload"
            exit 0
          fi
          CHUNK=5000
          TOTAL_LINES=$(wc -l < "$FILE")
          for START in $(seq 1 $CHUNK $TOTAL_LINES); do
            END=$((START + CHUNK - 1))
            sed -n "${START},${END}p" "$FILE" \
              | jq -R -s --arg job "cd" --arg service "deploy" --arg stage "deploy" --arg test "test" --arg ts "$(date +%s%N)" '
                {streams: [{stream: {job:$job, service:$service, stage:$stage, test:$test}, values: [[$ts, .]]}]}
              ' \
              | curl -s -X POST "${{ secrets.LOKI_URL }}/loki/api/v1/push" -H "Content-Type: application/json" --data-binary @-
          done

      - name: Send deploy status to Loki (success)
        if: ${{ success() }}
        run: |
          echo "deploy finished: success" \
            | jq -R -s --arg job "cd" --arg service "deploy" --arg stage "deploy" --arg test "test" --arg status "success" --arg ts "$(date +%s%N)" '
                {streams: [{stream: {job:$job, service:$service, stage:$stage, test:$test, status:$status}, values: [[$ts, .]]}]}
              ' \
            | curl -s -X POST "${{ secrets.LOKI_URL }}/loki/api/v1/push" -H "Content-Type: application/json" --data-binary @-

      - name: Send deploy status to Loki (failure)
        if: ${{ failure() }}
        run: |
          echo "deploy finished: failure" \
            | jq -R -s --arg job "cd" --arg service "deploy" --arg stage "deploy" --arg test "test" --arg status "failure" --arg ts "$(date +%s%N)" '
                {streams: [{stream: {job:$job, service:$service, stage:$stage, test:$test, status:$status}, values: [[$ts, .]]}]}
              ' \
            | curl -s -X POST "${{ secrets.LOKI_URL }}/loki/api/v1/push" -H "Content-Type: application/json" --data-binary @-
