# Test configuration with H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Disable Eureka for testing
eureka.client.enabled=false

# JWT configuration
jwt.secretKey=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# Notification service (mock URL for testing)
notification.service.url=http://localhost:8084/api/v1/notifications
app.frontend.url=http://localhost:4200
app.base-url=http://localhost:8081

file.upload-dir=src/test/resources/uploads

