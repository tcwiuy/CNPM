name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # --- PHẦN 1: KIỂM TRA CODE (CI) ---
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Liệt kê tên các thư mục chứa code Backend
        service: [api-gateway, eureka-service, user-service, order-service, restaurant-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21' # Phải khớp với code của bạn
          distribution: 'temurin'
          cache: 'maven'
      
      # Chạy lệnh Maven để kiểm tra xem code có lỗi cú pháp không
      - name: Build with Maven
        run: |
          cd ${{ matrix.service }}
          chmod +x mvnw
          ./mvnw clean package -DskipTests

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend
          npm install
          npm run build

  # --- PHẦN 2: ĐÓNG GÓI & VẬN CHUYỂN (CD) ---
  
  docker-backend:
    needs: build-backend # Bắt buộc phần CI phải xanh thì mới làm phần này
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, eureka-service, user-service, order-service, restaurant-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      
      # Cần cài lại Java để build file .jar (vì mỗi job chạy trên máy mới tinh)
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Build ra file .jar
      - name: Build Jar
        run: |
          cd ${{ matrix.service }}
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Debug: list build context
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          echo "Listing context for $SERVICE"
          ls -la "$SERVICE" || true
          echo "Dockerfile contents (if exists):"
          if [ -f "$SERVICE/Dockerfile" ]; then cat "$SERVICE/Dockerfile"; else echo 'No Dockerfile found'; fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Đăng nhập vào Docker Hub bằng chìa khóa bạn đã cất
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Đóng gói và Đẩy lên (explicit Dockerfile + platform để tránh lỗi không tìm thấy file)
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}

  docker-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug: list frontend build
        run: |
          echo "Listing frontend/dist"
          ls -la frontend || true
          if [ -d frontend/dist ]; then ls -la frontend/dist || true; else echo 'No frontend/dist found'; fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/food-ordering-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/food-ordering-frontend:${{ github.sha }}