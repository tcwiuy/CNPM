spring.application.name=restaurant-service
spring.datasource.url=jdbc:mysql://mysql:3306/restaurant_db?createDatabaseIfNotExist=true
spring.datasource.username=kyvy
spring.datasource.password=2407
spring.jpa.hibernate.ddl-auto=update
server.port=8082

#open-api
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

#eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.preferIpAddress=true

file.upload-dir=src/main/resources/uploads
app.base-url=http://localhost:8082

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MỚI THÊM CHO GIÁM SÁT
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always