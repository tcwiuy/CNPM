# Test configuration
spring.application.name=user-service-test
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secretKey=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# Disable Eureka for testing
eureka.client.enabled=false

# File upload
file.upload-dir=src/test/resources/uploads
app.base-url=http://localhost:8081

# Disable notification service calls in tests
notification.service.url=http://localhost:9999/api/v1/notifications
app.frontend.url=http://localhost:4200

