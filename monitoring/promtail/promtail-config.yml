server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker_sd
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Prefer explicit docker-compose service label when available
      - source_labels:
          [__meta_docker_container_label_com_docker_compose_service]
        regex: (.+)
        target_label: service
      # Fallback: extract service name from container name (strip project prefix and index)
      - source_labels: [__meta_docker_container_name]
        regex: "^(?:([^-_]+)[-_])?(.+?)(?:[-_][0-9]+)?$"
        replacement: "$2"
        target_label: service
      # Preserve original container name as label
      - source_labels: [__meta_docker_container_name]
        regex: "^/?(.+)$"
        target_label: container
      # Add compose project label if available
      - source_labels:
          [__meta_docker_container_label_com_docker_compose_project]
        regex: (.+)
        target_label: compose_project

  - job_name: file
    static_configs:
      - targets: ["localhost"]
        labels:
          job: varlogs
          __path__: /var/lib/docker/containers/*/*.log

  - job_name: host-logs
    static_configs:
      - targets: ["localhost"]
        labels:
          job: hostlogs
          __path__: /var/log/*.log
