spring.application.name=user-service-test

# H2 Database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JPA settings
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server port
server.port=0

# JWT settings
jwt.secretKey=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# Disable Eureka for tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Disable OpenAPI/Swagger for tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Disable caching for tests
spring.cache.type=none

# Spring Boot Actuator
management.endpoints.enabled-by-default=false

# Notification service (mocked in tests)
notification.service.url=http://localhost:8084/api/v1/notifications
app.frontend.url=http://localhost:4200

# File upload
file.upload-dir=target/test-uploads
app.base-url=http://localhost:8081

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Management endpoints
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
